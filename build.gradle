plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'dev.alconautics'
version = '0.1.12'
base { archivesName = 'create-alconautics' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
neoForge {
    version = project.findProperty('neoVersion') ?: '21.1.234'
    runs {
        client {
            client()
            if (project.hasProperty('tinctureCheck')) {
                systemProperty 'alconautics.tinctureCheck', 'true'
                gameDirectory = project.file('run-visual')
            }
            if (project.hasProperty('jeiCheck')) {
                systemProperty 'alconautics.jeiCheck', 'true'
                gameDirectory = project.file('run-visual')
            }
            if (project.hasProperty('bottleCheck')) {
                systemProperty 'alconautics.bottleCheck', 'true'
                gameDirectory = project.file('run-visual')
            }
            if (project.hasProperty('visualCheck') || project.hasProperty('ponderCheck') || project.hasProperty('renderScene') || project.hasProperty('renderDry')) {
                systemProperty 'alconautics.visualCheck', 'true'
                systemProperty 'alconautics.ponderCheck', (project.hasProperty('ponderCheck') || project.hasProperty('renderScene') || project.hasProperty('renderDry')).toString()
                systemProperty 'alconautics.renderScene', (project.hasProperty('renderScene') || project.hasProperty('renderDry')).toString()
                systemProperty 'alconautics.renderDry', project.hasProperty('renderDry').toString()
                gameDirectory = project.file('run-visual')
            }
        }
        server { server(); programArgument '--nogui' }
        gameTestServer { type = 'gameTestServer' }
        configureEach { systemProperty 'neoforge.enabledGameTestNamespaces', 'alconautics' }
    }
    mods { alconautics { sourceSet sourceSets.main } }
}
dependencies {
    implementation files('libs/create-1.21.1-6.0.10.jar')
    compileOnly fileTree(dir: 'libs/compile', include: '*.jar')
    compileOnly fileTree(dir: 'libs/runtime', include: '*.jar')
    runtimeOnly fileTree(dir: 'libs/runtime', include: '*.jar')
    if (project.hasProperty('cbcCheck')) runtimeOnly files('libs/compile/createbigcannons-5.11.7+mc.1.21.1.jar','libs/compile/ritchiesprojectilelib-2.1.2+mc.1.21.1-neoforge.jar')
    if (project.hasProperty('sableCheck')) runtimeOnly files('libs/compile/sable-neoforge-1.21.1-2.0.6.jar')
    if (project.hasProperty('compatCheck') || project.hasProperty('jeiCheck')) runtimeOnly files('libs/compile/createdieselgenerators-1.21.1-1.3.15.jar','libs/compile/jei-1.21.1-neoforge-19.69.0.457.jar')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(ProcessResources).configureEach { filteringCharset = 'UTF-8' }
tasks.named('jar') {
    includeEmptyDirs = false
    from('LICENSE')
    from('ASSET-NOTICES.md')
    exclude('dev/alconautics/test/**')
}
